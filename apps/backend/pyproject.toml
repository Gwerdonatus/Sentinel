[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.backends.legacy:build"

# =============================================================================
# pytest
# =============================================================================
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["."]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
addopts = [
    "--strict-markers",
    "--tb=short",
    "--cov=sentinel",
    "--cov-report=term-missing",
    "--cov-report=xml:coverage.xml",
    "--cov-fail-under=65",
]
markers = [
    "unit: Unit tests (no database, no network)",
    "integration: Integration tests (requires database)",
    "slow: Tests that take more than 1 second",
]

# =============================================================================
# mypy
# =============================================================================
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
no_implicit_reexport = true
disallow_any_generics = true
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
strict = false

[[tool.mypy.overrides]]
module = [
    "factory.*",
    "celery.*",
    "decouple.*",
    "drf_spectacular.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "config.celery"
ignore_errors = true

[tool.django-stubs]
django_settings_module = "config.settings"

# =============================================================================
# ruff
# =============================================================================
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["sentinel", "config", "tests"]

[tool.ruff.lint]
select = [
    "E4",   # import and indentation errors
    "E7",   # statement errors
    "E9",   # syntax/runtime errors
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "S",    # flake8-bandit (security)
    "DJ",   # flake8-django
]
ignore = [
    "B904",    # Exception chaining will be introduced incrementally
    "S101",    # Use of assert (OK in tests)
    "DJ001",   # Avoid using `null=True` on string-based fields (we have intentional nulls)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"config/settings.py" = ["S105"]
"**/migrations/**" = ["E4", "E7", "E9", "F", "I", "B", "S", "DJ"]

[tool.ruff.lint.isort]
known-first-party = ["sentinel", "config"]
known-third-party = ["django", "rest_framework", "celery"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# =============================================================================
# coverage
# =============================================================================
[tool.coverage.run]
source = ["sentinel"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/__init__.py",
    "*/management/commands/*",
    "config/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@abstractmethod",
]
fail_under = 65

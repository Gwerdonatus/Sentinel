---
# =============================================================================
# Sentinel Secrets — TEMPLATE ONLY.
#
# NEVER commit real values to this file.
# In production, this file is generated by the CD pipeline using
# GitHub Actions secrets, or managed by an external secrets operator
# (External Secrets Operator with AWS Secrets Manager / Vault).
#
# For local Kubernetes testing, use:
#   kubectl create secret generic sentinel-secrets \
#     --from-env-file=.env \
#     --namespace=sentinel
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: sentinel-secrets
  namespace: sentinel
  labels:
    app.kubernetes.io/name: sentinel
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  SECRET_KEY: "REPLACE_WITH_50_CHAR_RANDOM_STRING"
  DATABASE_URL: "postgres://sentinel:PASSWORD@postgresql.sentinel.svc.cluster.local:5432/sentinel_db"
  REDIS_URL: "redis://:PASSWORD@redis.sentinel.svc.cluster.local:6379/0"
  CELERY_BROKER_URL: "redis://:PASSWORD@redis.sentinel.svc.cluster.local:6379/1"
  CELERY_RESULT_BACKEND: "redis://:PASSWORD@redis.sentinel.svc.cluster.local:6379/2"
  JWT_SIGNING_KEY: "REPLACE_WITH_50_CHAR_RANDOM_STRING"

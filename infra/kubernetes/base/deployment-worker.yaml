---
# =============================================================================
# Sentinel Celery Worker Deployment
# Handles: async audit recording, notification delivery, report generation
# HPA scales on Celery queue depth (custom metric via kube-state-metrics)
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinel-worker
  namespace: sentinel
  labels:
    app.kubernetes.io/name: sentinel
    app.kubernetes.io/component: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: sentinel
      app.kubernetes.io/component: worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sentinel
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: sentinel-worker
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
      terminationGracePeriodSeconds: 120  # Allow in-flight tasks to complete
      containers:
        - name: worker
          image: ghcr.io/gwerdonatus/sentinel-backend:latest
          command:
            - celery
            - -A
            - config.celery
            - worker
            - --loglevel=info
            - --concurrency=4
            - --queues=default,high_priority
            - --prefetch-multiplier=1
          envFrom:
            - configMapRef:
                name: sentinel-config
            - secretRef:
                name: sentinel-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            exec:
              command:
                - celery
                - -A
                - config.celery
                - inspect
                - ping
                - -d
                - celery@$HOSTNAME
            initialDelaySeconds: 30
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}

---
# =============================================================================
# Sentinel Kafka Consumer Deployment
# One replica per Kafka partition for ordered processing guarantees.
# Phase 5: 1 replica (single partition). Scale with partition count.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinel-kafka-consumer
  namespace: sentinel
  labels:
    app.kubernetes.io/name: sentinel
    app.kubernetes.io/component: kafka-consumer
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sentinel
      app.kubernetes.io/component: kafka-consumer
  strategy:
    type: Recreate    # Not RollingUpdate — rebalancing mid-deploy causes duplicate processing
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sentinel
        app.kubernetes.io/component: kafka-consumer
    spec:
      serviceAccountName: sentinel-worker
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
      terminationGracePeriodSeconds: 60  # Allow current message to finish + commit offset
      containers:
        - name: consumer
          image: ghcr.io/gwerdonatus/sentinel-backend:latest
          command: ["python", "manage.py", "run_kafka_consumer"]
          envFrom:
            - configMapRef:
                name: sentinel-config
            - secretRef:
                name: sentinel-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}

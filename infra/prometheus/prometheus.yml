---
# =============================================================================
# Sentinel Prometheus Configuration
# =============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    service: sentinel
    environment: development

# Alerting rules
rule_files:
  - /etc/prometheus/rules/*.yml

# Alertmanager (configure in production)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ["alertmanager:9093"]

scrape_configs:

  # Django backend — django-prometheus exposes /metrics
  - job_name: "sentinel-backend"
    static_configs:
      - targets: ["backend:8000"]
    metrics_path: /metrics
    scrape_interval: 15s

  # Celery worker metrics via Flower API
  - job_name: "sentinel-celery"
    static_configs:
      - targets: ["flower:5555"]
    metrics_path: /metrics
    scrape_interval: 30s

  # OpenTelemetry Collector self-metrics
  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8888"]
    scrape_interval: 30s

  # Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Kafka consumer lag (via kafka-exporter — add to docker-compose for full monitoring)
  # - job_name: "kafka"
  #   static_configs:
  #     - targets: ["kafka-exporter:9308"]

  # PostgreSQL exporter
  # - job_name: "postgresql"
  #   static_configs:
  #     - targets: ["postgres-exporter:9187"]

  # Redis exporter
  # - job_name: "redis"
  #   static_configs:
  #     - targets: ["redis-exporter:9121"]
